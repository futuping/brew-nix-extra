name: Retry Chrome CI infrastructure failures

on:
  workflow_run:
    workflows: [Update Google Chrome]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write
  checks: read

concurrency:
  group: retry-chrome-ci-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      ${{ contains(fromJSON('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
          && contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Only execute the trusted default branch, never the triggering checkout
      # or an artifact. The script independently verifies the run's provenance.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Retry only a recognized infrastructure failure within its budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          nix run --no-update-lock-file .#retry-chrome-ci -- \
            --repository "$SOURCE_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --attempt "$SOURCE_ATTEMPT" \
            --apply
