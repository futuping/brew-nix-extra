name: Update Google Chrome

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Download and verify the DMG even when validators match
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-google-chrome
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Run updater tests
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Update the verified source pin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.force }}" == "true" ]]; then
            nix run --no-update-lock-file .#update-google-chrome -- --force
          else
            nix run --no-update-lock-file .#update-google-chrome
          fi

      - name: Check updated source
        run: nix run --no-update-lock-file .#maintainer-check

      - name: Commit an update or keep schedules active
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- sources/google-chrome.json; then
            version="$(
              nix eval --raw --impure --expr \
                '(builtins.fromJSON (builtins.readFile ./sources/google-chrome.json)).version'
            )"
            git add sources/google-chrome.json
            git commit -m "chore: update Google Chrome to ${version}"
            git push
            exit 0
          fi

          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date +%s)"
          if (( now_epoch - last_commit_epoch >= 30 * 24 * 60 * 60 )); then
            git commit --allow-empty -m "chore: keep updater active"
            git push
          fi
